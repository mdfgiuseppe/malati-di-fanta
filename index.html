<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10b981">
  <title>Malati di Fanta</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- SPLASH SCREEN -->
    <div id="splash" class="page active">
      <div class="splash-content">
        <div class="splash-logo">
          <img src="logo.png" alt="Malati di Fanta">
        </div>
        <h1>MALATI DI FANTA</h1>
        <p class="splash-sub">Fantacalcio Manageriale Continuativo</p>
        <p class="splash-year">SINCE 2019</p>
        <button class="splash-btn" onclick="app.enterApp()">→ ENTRA NELLA PIATTAFORMA</button>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="page">
      <!-- NAVBAR -->
      <header class="navbar">
        <div class="logo-area" onclick="app.handleLogoClick()">
          <img src="logo.png" alt="Malati di Fanta" class="logo-img">
          <h1>MALATI DI FANTA</h1>
        </div>
        <div class="navbar-right">
          <button class="theme-toggle" onclick="app.toggleTheme()" title="Cambia tema">🌙</button>
          <button class="nav-btn accedi-btn" onclick="app.toggleAdmin()" id="accedi-btn">🔐 ACCEDI</button>
        </div>
      </header>

      <!-- LAYOUT -->
      <div class="layout">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <h2>SEZIONI</h2>
          </div>
          <nav class="sidebar-menu" id="sidebar-menu">
            <!-- Populated by JS -->
          </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-area" id="main-content">
          <!-- Populated by JS -->
        </main>
      </div>
    </div>
  </div>

  <!-- LOGIN MODAL -->
  <div id="login-modal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h2>LOGIN ADMIN</h2>
        <button class="close-btn" onclick="app.closeLoginModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password-input" placeholder="Inserisci password" onkeyup="if(event.key==='Enter') app.submitLogin()">
        </div>
        <div id="error-msg" class="error-msg" style="display: none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="app.closeLoginModal()">Annulla</button>
        <button class="btn-login" onclick="app.submitLogin()">Accedi</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/calculations.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
