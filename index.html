<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10b981">
  <title>Malati di Fanta</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #07090f;
      --bg2: #0d1220;
      --bg3: #131b2e;
      --card: #101622;
      --card2: #18213a;
      --border: rgba(255, 255, 255, 0.055);
      --text: #eef2ff;
      --text2: #6a7d9e;
      --text3: #2e3e5e;
      --green: #10b981;
    }

    :root[data-theme="light"] {
      --bg: #f0f4fc;
      --bg2: #e4eaf6;
      --bg3: #d6dff0;
      --card: #ffffff;
      --card2: #f4f7fe;
      --border: rgba(0, 10, 40, 0.07);
      --text: #08101e;
      --text2: #4a5a7a;
      --text3: #9aacc0;
      --green: #059669;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Barlow", sans-serif; background: var(--bg); color: var(--text); }

    .topbar { position: sticky; top: 0; z-index: 200; height: 56px; background: rgba(7, 9, 15, 0.92); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; }
    .topbar-logo { height: 36px; cursor: pointer; }
    .topbar-right { margin-left: auto; display: flex; gap: 8px; }
    .theme-toggle { width: 40px; height: 22px; background: var(--card2); border: 1px solid var(--border); border-radius: 11px; cursor: pointer; font-size: 14px; }

    .layout { display: flex; min-height: calc(100vh - 56px); }
    .sidebar { width: 220px; background: var(--bg2); border-right: 1px solid var(--border); padding: 20px 0; }
    .sidebar-item { display: block; width: 100%; padding: 12px 16px; border: none; background: none; color: var(--text2); cursor: pointer; text-align: left; border-left: 3px solid transparent; }
    .sidebar-item.active { color: var(--green); background: rgba(16, 185, 129, 0.06); border-left-color: var(--green); }

    .main-area { flex: 1; padding: 24px; overflow-y: auto; }

    .page-title { font-family: "Bebas Neue"; font-size: 32px; letter-spacing: 2px; margin-bottom: 12px; }
    .page-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; transition: all 0.2s; }
    .card:hover { transform: translateY(-4px); }

    .card-logo { height: 90px; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, rgba(59, 130, 246, 0.12), var(--bg2)); }
    .card-logo img { height: 70px; width: auto; object-fit: contain; }

    .card-body { padding: 16px; }
    .card-name { font-family: "Bebas Neue"; font-size: 16px; letter-spacing: 1px; margin-bottom: 8px; }
    .card-stat { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; color: var(--text2); }
    .card-action { width: 100%; padding: 8px; margin-top: 12px; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); color: var(--green); border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 10px; }

    .section { display: none; }
    .section.active { display: block; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <img src="logo.png" alt="Logo" class="topbar-logo" id="logo-btn">
    <div class="topbar-right">
      <button class="theme-toggle" id="theme-btn">☀️</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button class="sidebar-item active" data-section="dashboard">📊 Dashboard</button>
      <button class="sidebar-item" data-section="leghe">⚽ Leghe</button>
      <button class="sidebar-item" data-section="admin">⚙️ Admin</button>
    </aside>

    <main class="main-area">
      <section class="section active" id="section-dashboard">
        <h1 class="page-title">Scegli il Torneo</h1>
        <p class="page-sub">Seleziona un torneo per visualizzare le leghe</p>
        <div class="cards-grid" id="tornei-grid"></div>
      </section>

      <section class="section" id="section-leghe">
        <h1 class="page-title" id="leghe-title">Leghe</h1>
        <div class="cards-grid" id="leghe-grid"></div>
      </section>

      <section class="section" id="section-admin">
        <h1 class="page-title">Admin</h1>
        <div id="admin-content"></div>
      </section>
    </main>
  </div>

  <div id="login-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center;">
    <div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 300px;">
      <h2 style="margin-bottom: 16px;">Login Admin</h2>
      <input type="password" id="login-pwd" placeholder="Password" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); margin-bottom: 12px;">
      <div id="login-error" style="color: #ef4444; font-size: 11px; margin-bottom: 12px;"></div>
      <div style="display: flex; gap: 8px;">
        <button onclick="app.closeLogin()" style="flex: 1; padding: 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;">Annulla</button>
        <button onclick="app.submitLogin()" style="flex: 1; padding: 8px; background: var(--green); border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: 700;">Accedi</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
