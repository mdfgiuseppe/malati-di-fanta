<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malati di Fanta</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] { --bg: #07090f; --text: #eef2ff; --green: #10b981; }
    :root[data-theme="light"] { --bg: #f0f4fc; --text: #08101e; --green: #059669; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Barlow", sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    h1 { font-family: "Bebas Neue"; font-size: 36px; margin-bottom: 20px; }
    .card { background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px; margin-bottom: 16px; cursor: pointer; }
    .card:hover { background: rgba(255,255,255,0.1); }
    button { background: var(--green); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 700; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🏆 Malati di Fanta</h1>
  <div id="app">Caricamento...</div>
  <script src="app.js"></script>
</body>
</html>
